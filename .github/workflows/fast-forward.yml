# Fallback for when the routine pushes to a claude/ branch instead of main.
# Fast-forwards main (so commit authors stay yours), deletes the branch,
# and starts a deploy. Pushes made with GITHUB_TOKEN don't trigger other
# workflows, which is why the deploy is started explicitly.
name: Fast-forward main from claude/ branches

on:
  push:
    branches: ["claude/brief-*"]

permissions:
  contents: write
  actions: write

jobs:
  fast-forward:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git fetch origin "$BRANCH"
          bad=$(git diff --name-only main "origin/$BRANCH" | grep -vE '^(posts|digest)/' || true)
          if [ -n "$bad" ]; then echo "Refusing to publish changes outside posts/ and digest/: $bad"; exit 1; fi
          git merge --ff-only "origin/$BRANCH"
          git push origin main
          git push origin --delete "$BRANCH"

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
