# Syllabus: one unit per week, taught in the order listed.
#
# You own this file. The weekly routine reads it to decide what to teach next
# and never edits it. Reorder, merge, or cut units freely. The slug is the
# unit's permanent ID, so keep it stable once a unit has been taught.
#
# Fields
#   slug        permanent ID, lowercase-with-dashes; also the unit's folder under units/
#   module      groups units on the course map
#   title       shown on the site
#   covers      the topics the week's sessions must cover (together, the units
#               cover every topic from the original daily curriculum)
#   objectives  what you should be able to do afterwards; the weekly quiz and
#               the debrief of your lab notes test exactly these
#   builds_on   earlier units the lessons should connect back to
#   cases       real incidents that anchor the lessons; IDs in course/cases.yaml
#   lab         the week's exercise; ID in course/labs.yaml
#   attack      MITRE ATT&CK technique IDs, used in the detection material
#
# The cases and lab IDs are placeholders until course/cases.yaml and
# course/labs.yaml exist and each entry has been checked against its source.
# An empty cases list means no well-documented incident has been picked yet.

units:

  # Foundations ---------------------------------------------------------------

  - slug: lab-and-linux
    module: Foundations
    title: "Your lab, and Linux through a security lens"
    covers:
      - "Building a home lab: hypervisor, attacker VM, deliberately vulnerable target, isolated network"
      - "The Linux permission model: users, groups, SUID, capabilities"
      - "Getting started with CTFs"
    objectives:
      - "Run an isolated lab network where nothing you practice on can reach the internet or your home network"
      - "Explain how Linux decides whether a process may read a file or act as another user"
      - "Work in a Linux shell comfortably enough that it stops being the hard part of a lab"
    builds_on: []
    cases: []
    lab: otw-bandit
    attack: []

  - slug: threat-modeling
    module: Foundations
    title: "Thinking like an attacker: threat modeling, risk, and the industry"
    covers:
      - "Threat modeling with STRIDE"
      - "Risk, the CIA triad, and how security decisions actually get made"
      - "The security industry map: who sells what (endpoint, identity, cloud, SIEM, MDR, services)"
    objectives:
      - "Draw a data-flow diagram of a system and mark its trust boundaries"
      - "Use STRIDE to list threats against that system and rank them by risk"
      - "Explain which kinds of company sell which defenses, and where each sits in an attack"
    builds_on: []
    cases: [target-2013]
    lab: threat-model-own-project
    attack: []

  - slug: networks-and-exposure
    module: Foundations
    title: "Networks from an attacker's view"
    covers:
      - "Ports, services, and what an organisation exposes to the internet"
      - "Host discovery, port scanning, and service detection with nmap"
      - "Enumerating common services: SMB, FTP, SSH, HTTP"
    objectives:
      - "Explain what a scan reveals and why exposed services are where many intrusions start"
      - "Scan a target in your own lab and account for every open port you find"
      - "Describe what scanning looks like from the defender's side, in firewall and IDS logs"
    builds_on: [lab-and-linux]
    cases: [mirai-2016]
    lab: nmap-own-lab
    attack: [T1595, T1046]

  - slug: dns-and-tls
    module: Foundations
    title: "Trust on the internet: DNS and TLS"
    covers:
      - "How DNS works and how it is abused: hijacking, tunneling, subdomain takeover"
      - "TLS and certificates: what they protect and what they don't"
    objectives:
      - "Trace a name lookup and a TLS handshake, and say what someone on the network path can and cannot see or change"
      - "Explain how a mis-issued certificate breaks the trust model and what certificate transparency adds"
      - "Run TLS with your own certificate authority in your lab and compare the traffic before and after"
    builds_on: [networks-and-exposure]
    cases: [diginotar-2011, sea-turtle-2019]
    lab: own-ca-tls-lab
    attack: [T1071.004, T1557]

  - slug: crypto-and-passwords
    module: Foundations
    title: "Cryptographic building blocks and password storage"
    covers:
      - "Hashing, encryption, signatures, and MACs"
      - "Password storage: salting, bcrypt and Argon2, and why fast hashes fail"
    objectives:
      - "Pick the right primitive (hash, MAC, symmetric or public-key encryption, signature) for a given security goal"
      - "Explain why salted, deliberately slow hashes protect stored passwords and fast unsalted hashes do not"
      - "Recognise classic misuse, such as ECB mode or unsalted hashes, in a real system"
    builds_on: []
    cases: [linkedin-2012, adobe-2013]
    lab: cryptopals-set-1
    attack: []

  - slug: authentication-and-mfa
    module: Foundations
    title: "Authentication, password attacks, and how MFA fails"
    covers:
      - "Password attacks: cracking, spraying, credential stuffing"
      - "Authentication, sessions, and how MFA gets bypassed"
    objectives:
      - "Explain the difference between cracking, spraying, and stuffing, and which control stops each"
      - "Measure in your lab how much longer a bcrypt hash takes to crack than an MD5 hash of the same password"
      - "Rank MFA methods by how well they resist phishing and push fatigue, and say why"
    builds_on: [crypto-and-passwords]
    cases: [23andme-2023, uber-2022, snowflake-2024]
    lab: hashcat-own-hashes
    attack: [T1110.002, T1110.003, T1110.004, T1621, T1078]

  # Methodology ---------------------------------------------------------------

  - slug: how-security-work-is-done
    module: Methodology
    title: "How offensive security work is done"
    covers:
      - "What a penetration test is: scope, rules of engagement, written authorization"
      - "Pentests, red teams, vulnerability assessments, and bug bounties compared"
      - "Passive reconnaissance and OSINT"
      - "Writing findings that get fixed: the pentest report"
      - "Careers in security: offensive, defensive, and governance roles, and which certifications matter"
    objectives:
      - "Explain why written authorization and a clear scope are what separate a security test from a crime"
      - "Write a scope and rules-of-engagement document for your own lab"
      - "Write one finding a developer could fix from, with impact, evidence, and remediation"
    builds_on: [networks-and-exposure]
    cases: [coalfire-iowa-2019]
    lab: scope-and-report-own-lab
    attack: [T1593, T1589]

  # Web -----------------------------------------------------------------------

  - slug: browser-security-model
