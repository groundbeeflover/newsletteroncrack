    covers:
      - "Broken access control and IDOR"
      - "API security: broken object-level authorization and mass assignment"
    objectives:
      - "Explain why authorization must be checked on the server for every object, not just every page"
      - "Solve the practice labs and name the server-side check that would have prevented each flaw"
      - "Describe how this shows up in application logs, such as one session requesting many sequential IDs"
    builds_on: [browser-security-model]
    cases: [first-american-2019, optus-2022]
    lab: portswigger-access-control
    attack: [T1190]

  - slug: sql-injection
    module: Web
    title: "SQL injection"
    covers:
      - "SQL injection"
    objectives:
      - "Explain how mixing code and data in a query lets input change what the query means"
      - "Solve the practice labs, then explain why parameterized queries fix the root cause and input filtering does not"
      - "Name the signs of injection attempts in web server and database logs"
    builds_on: [access-control]
    cases: [moveit-2023]
    lab: portswigger-sqli
    attack: [T1190]

  - slug: xss-and-csp
    module: Web
    title: "Cross-site scripting and Content Security Policy"
    covers:
      - "Cross-site scripting: reflected, stored, DOM-based"
      - "Content Security Policy as a defense against XSS"
    objectives:
      - "Explain the three kinds of XSS and why correct output encoding depends on context"
      - "Solve the practice labs and say which defense would have stopped each one"
      - "Read this site's own Content Security Policy and explain what it does and does not stop"
    builds_on: [browser-security-model]
    cases: [samy-worm-2005, british-airways-2018]
    lab: portswigger-xss
    attack: []

  - slug: web-auth-and-tokens
    module: Web
    title: "Web authentication, sessions, OAuth, and tokens"
    covers:
      - "Authentication and session management flaws"
      - "OAuth 2.0 and OpenID Connect: what they're for and common misconfigurations"
      - "JSON Web Token pitfalls"
    objectives:
      - "Explain how a session or bearer token stands in for a password, and what follows if one leaks"
      - "Explain the main OAuth 2.0 and OpenID Connect flows and the misconfigurations that break them"
      - "Solve the JWT practice labs and list every check a server must make before trusting a token"
    builds_on: [authentication-and-mfa, browser-security-model]
    cases: [citrix-bleed-2023, storm-0558-2023]
    lab: portswigger-jwt
    attack: [T1539, T1550.001, T1606]

  - slug: server-side-injection
    module: Web
    title: "Injection beyond SQL: commands, templates, and lookups"
    covers:
      - "OS command injection"
      - "Server-side template injection"
      - "Lookup injection, as in Log4Shell"
    objectives:
      - "Explain the root cause that command injection, template injection, and Log4Shell share"
      - "Solve the practice labs and name the design change that removes each bug class"
      - "Explain why Log4Shell was so hard to find and patch across an organisation"
