    cases: [citrix-adc-2019]
    lab: portswigger-path-traversal
    attack: [T1190, T1505.003]

  - slug: ssrf
    module: Web
    title: "Server-side request forgery and cloud metadata"
    covers:
      - "Server-side request forgery and cloud metadata endpoints"
    objectives:
      - "Explain why a server that fetches user-supplied URLs can be turned against the network behind it"
