    cases: [shellshock-2014, log4shell-2021]
    lab: portswigger-os-command-injection
    attack: [T1190, T1059]

  - slug: files-and-parsers
    module: Web
    title: "Files and parsers: path traversal, uploads, XXE, deserialization"
    covers:
      - "Path traversal and unsafe file uploads"
      - "XML external entities"
      - "Insecure deserialization"
    objectives:
      - "Explain why file paths, uploaded files, XML, and serialized objects are all untrusted input in disguise"
      - "Solve the path traversal and file upload practice labs"
      - "Name the safe default that prevents each: no external entities, no native deserialization of untrusted data, uploads stored outside the web root"
