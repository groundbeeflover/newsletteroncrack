# Lab catalogue: one exercise for each unit's lab week.
#
# You own this file. The weekly routine reads it and never edits it. It may only
# assign a lab whose `checked` field is set, and it never links to a lab or tool
# that isn't listed here.
#
# Fields
#   id        referenced from `lab` in course/units.yaml
#   name
#   kind      platform: a hosted environment built to be attacked
#             own-lab:  your own isolated VMs or containers, never a network you don't own
#             writing:  a document you produce
#   url       where to start
#   cost      free, or premium (needs a paid subscription), as listed on 2026-10-30
#   time      rough hours, including reading and notes
#   setup     what needs to be in place first
#   do        what to complete this week
#   defender  what to look at from the defender's side; write it in your notes
#   extra     optional alternatives and stretch goals
#   checked   null until you've opened the links and agree with the entry; then the date
#
# Every URL below loaded on 2026-10-30. TryHackMe rooms were opened in a browser
# to confirm their free or premium status and listed duration. PortSwigger's
# Web Security Academy is free but needs an account.

labs:

  - id: otw-bandit
    name: "OverTheWire Bandit, and building your lab"
    kind: platform
    url: https://overthewire.org/wargames/bandit/
    cost: free
    time: "4-6 h"
    setup: "A hypervisor and an attacker VM. Put a deliberately vulnerable target (Metasploitable 2) on a host-only network with no route to the internet or your home network."
    do: "Get through Bandit levels 0 to 15. Finish the rest over the coming weeks."
    defender: "For each level, note which file permission or setting let you read something you shouldn't have, and how you would fix it."
    extra:
      - title: "VirtualBox"
        url: https://www.virtualbox.org/
      - title: "Kali Linux downloads"
        url: https://www.kali.org/get-kali/
      - title: "Metasploitable 2 (Rapid7 docs, including network warnings)"
        url: https://docs.rapid7.com/metasploit/metasploitable-2/
    checked: 2026-10-30

  - id: threat-model-own-project
    name: "Threat model one of your own projects"
    kind: writing
    url: https://shostack.org/resources/threat-modeling
    cost: free
    time: "2-3 h"
    setup: "Pick a system you've built or know well, such as a web app or your thesis code."
    do: "Draw its data-flow diagram with trust boundaries, apply STRIDE to each element, rank the threats, and propose a fix for the top three."
    defender: "For each top threat, would anything you log today show it happening?"
    extra:
      - title: "OWASP Threat Dragon (diagramming tool)"
        url: https://owasp.org/projects/threat-dragon
      - title: "Elevation of Privilege (threat modeling card game)"
        url: https://github.com/adamshostack/eop
    checked: null

  - id: nmap-own-lab
    name: "Scan and enumerate your own lab target"
    kind: own-lab
    url: https://nmap.org/book/toc.html
    cost: free
    time: "2-3 h"
    setup: "Metasploitable 2 running on your isolated lab network."
    do: "Discover the host, scan all TCP ports, identify service versions, then enumerate SMB, FTP, SSH and HTTP by hand. Write an inventory listing every open port and why it matters."
    defender: "Capture traffic on the target side while you scan, and compare how noisy different scan types are."
    extra:
      - title: "Metasploitable 2 documentation"
        url: https://docs.rapid7.com/metasploit/metasploitable-2/
    checked: null

  - id: own-ca-tls-lab
    name: "Run your own certificate authority and inspect TLS"
    kind: own-lab
    url: https://jamielinux.com/docs/openssl-certificate-authority/
    cost: free
    time: "2-3 h"
    setup: "Two lab VMs, a web server, and Wireshark."
    do: "Create a root CA and a server certificate with OpenSSL, serve a page over HTTP and then HTTPS, and capture both. Then decrypt your own capture with a key log file to see exactly what TLS was hiding."
    defender: "List what stays visible to a network observer even with TLS: IP addresses, server name, timing and sizes."
    extra:
      - title: "TLS on the Wireshark wiki (decryption with key log files)"
        url: https://wiki.wireshark.org/TLS
    checked: null

  - id: cryptopals-set-1
    name: "Cryptopals, set 1"
    kind: platform
    url: https://cryptopals.com/sets/1
    cost: free
    time: "3-5 h"
    setup: "Any programming language you're comfortable in."
    do: "Solve challenges 1 to 8. Challenges 7 and 8 are about AES in ECB mode, the same weakness behind the Adobe case."
    defender: "Write down why ECB output reveals patterns, and what you would look for when reviewing someone's crypto code."
    extra: []
    checked: null

  - id: hashcat-own-hashes
    name: "Crack hashes you made yourself"
    kind: own-lab
    url: https://hashcat.net/wiki/
    cost: free
    time: "2 h"
    setup: "hashcat, a public wordlist, and a handful of test passwords you choose, hashed by you as MD5, SHA-256 and bcrypt."
    do: "Run a dictionary attack against each set and use benchmark mode to compare speeds. Work out how long each format would take for an 8-character random password."
    defender: "Online attacks look different from offline cracking: describe how spraying and credential stuffing would appear in a login log."
    extra:
      - title: "hashcat example hashes (for checking formats)"
        url: https://hashcat.net/wiki/doku.php?id=example_hashes
    checked: null

  - id: scope-and-report-own-lab
    name: "Scope, recon, and your first written finding"
    kind: writing
    url: https://tryhackme.com/room/ohsint
    cost: free
    time: "2-3 h"
    setup: "Your notes from the scanning week."
    do: "Write a one-page scope and rules of engagement for your lab. Do the OhSINT room (about 60 min) for passive recon. Then write one finding from your scan as it would appear in a real report: title, impact, evidence, fix."
    defender: "Note which recon steps the target could detect and which it could not."
    extra:
      - title: "Public penetration test reports (examples of real findings)"
        url: https://github.com/juliocesarfort/public-pentesting-reports
    checked: null

