  - id: stuxnet-2010
    title: "Stuxnet"
    year: 2010
    summary: >-
      Stuxnet was a worm built to sabotage uranium-enrichment centrifuges by
      reprogramming Siemens industrial controllers while showing operators
      normal readings. It spread by USB drive and network, used several
      previously unknown Windows vulnerabilities, and was signed with stolen
      code-signing certificates.
    root_cause: "Air-gapped industrial systems reachable through removable media and trusted signed code"
    would_have_helped:
      - "Controls on removable media in industrial environments"
      - "Integrity monitoring of controller logic"
