  - id: notpetya-2017
    title: "NotPetya"
    year: 2017
    summary: >-
      Destructive malware disguised as ransomware spread from a compromised
      update of Ukrainian accounting software, then moved between machines using
      stolen credentials and an SMB exploit. It wiped systems at companies
      worldwide. The US charged Russian military intelligence officers, citing
      nearly $1 billion in losses at just three victims.
    root_cause: "A trusted software update channel, plus flat networks with reusable admin credentials"
    would_have_helped:
      - "Segmentation and unique local admin passwords (LAPS)"
      - "Patching SMB vulnerabilities"
      - "Offline, tested backups"
    sources:
