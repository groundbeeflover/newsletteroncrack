  - id: cuckoos-egg-1986
    title: "The Cuckoo's Egg"
    year: 1986
    summary: >-
      Clifford Stoll, a systems administrator at Lawrence Berkeley Laboratory,
      traced a 75-cent accounting error to an intruder using the lab as a
      stepping stone into military networks. He kept the intruder online with
      fake documents long enough to trace him to Germany, where he was found to
      be selling information to the KGB. It is one of the earliest documented
      uses of deception in defense.
    root_cause: "Default and weak accounts on trusting, interconnected systems"
    would_have_helped:
      - "Removing default accounts and passwords"
      - "Careful logging, which is how the intrusion was noticed at all"
    sources:
      - kind: research
        title: "Stalking the Wily Hacker (Clifford Stoll, Communications of the ACM, 1988)"
        url: https://doi.org/10.1145/42411.42412
    checked: null

  - id: uber-2016
    title: "Uber data breach and cover-up"
    year: 2016
    summary: >-
      Intruders got into Uber engineers' GitHub accounts with passwords reused
      from other breaches, found a plain-text cloud access key in a private
      repository, and downloaded data on about 57 million riders and drivers.
      Uber paid the attackers $100,000 through its bug bounty program and did
      not disclose the breach for a year; its former security chief was later
      convicted for the cover-up.
    root_cause: "A powerful long-lived key in source code, reachable through accounts without MFA"
    would_have_helped:
      - "No secrets in code; a secrets manager with short-lived credentials"
      - "MFA and company-managed accounts for code hosting"
      - "Timely, honest breach disclosure"
    sources:
      - kind: official
        title: "FTC addresses Uber's undisclosed data breach in new proposed order (FTC)"
        url: https://www.ftc.gov/business-guidance/blog/2018/04/ftc-addresses-ubers-undisclosed-data-breach-new-proposed-order
      - kind: court
        title: "Former Chief Security Officer Of Uber Convicted Of Federal Charges For Covering Up Data Breach (US DOJ)"
        url: https://www.justice.gov/usao-ndca/pr/former-chief-security-officer-uber-convicted-federal-charges-covering-data-breach
      - kind: company
        title: "2016 Data Security Incident (Uber, 2017)"
        url: https://www.uber.com/newsroom/2016-data-incident/
    checked: null

  - id: tesla-cryptojacking-2018
    title: "Tesla Kubernetes cryptojacking"
    year: 2018
    summary: >-
      Researchers at RedLock found a Tesla Kubernetes admin console exposed to
      the internet without a password. Attackers had used it to run
      cryptocurrency miners, and cloud credentials were visible inside the
      cluster.
    root_cause: "An internet-exposed, unauthenticated cluster management console"
    would_have_helped:
      - "Never exposing cluster dashboards publicly; requiring authentication"
      - "Keeping cloud credentials out of pod configuration"
      - "Monitoring for unexpected workloads and CPU use"
    sources:
      - kind: press
        title: "Hackers Hijacked Tesla's Cloud to Mine Cryptocurrency (Wired)"
        url: https://www.wired.com/story/cryptojacking-tesla-amazon-cloud/
    checked: null

  - id: codecov-2021
    title: "Codecov Bash Uploader compromise"
    year: 2021
    summary: >-
      An attacker modified Codecov's Bash Uploader script, which many companies
      ran inside their CI pipelines, so that it sent the pipelines' environment
      variables (often full of secrets) to the attacker. It went unnoticed for
      about two months, until a customer compared the script with its published
      checksum.
    root_cause: "CI pipelines running a remotely fetched script with access to every secret"
    would_have_helped:
      - "Verifying checksums or signatures of downloaded build tools"
      - "Giving each CI step only the secrets it needs"
      - "Rotating CI secrets regularly"
    sources:
      - kind: company
        title: "Bash Uploader Security Update (Codecov)"
        url: https://about.codecov.io/security-update/
    checked: null

  - id: event-stream-2018
    title: "event-stream npm package backdoor"
    year: 2018
    summary: >-
      The maintainer of event-stream, a popular npm package, handed it over to a
      volunteer who then added a dependency containing hidden code. The code
      targeted one specific application, a Bitcoin wallet, to steal funds.
    root_cause: "Trust in a package transferred to an unknown maintainer, with obfuscated code nobody reviewed"
    would_have_helped:
      - "Pinning dependency versions and reviewing updates"
      - "Watching for maintainer changes in critical dependencies"
    sources:
