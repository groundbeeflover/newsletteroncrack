    checked: null

  - id: pwnkit-2022
    title: "PwnKit"
    year: 2022
    summary: >-
      Qualys found a memory corruption bug in polkit's pkexec (CVE-2021-4034), a
      SUID-root program installed by default on most Linux distributions. It let
      any local user become root, and had been present for over a decade.
    root_cause: "A memory-safety bug in a SUID-root binary"
    would_have_helped:
      - "Fewer SUID binaries"
      - "Prompt patching"
      - "Monitoring for unexpected root shells spawned by pkexec"
