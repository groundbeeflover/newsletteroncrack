  - id: change-healthcare-2024
    title: "Change Healthcare ransomware attack"
    year: 2024
    summary: >-
      Attackers used stolen credentials to log in to a Change Healthcare Citrix
      remote-access portal that, the parent company's CEO told Congress, did not
      have MFA. They deployed ransomware nine days later, disrupting payments
      and prescriptions across the US health system. UnitedHealth paid a ransom.
    root_cause: "A remote-access portal without MFA, inherited through an acquisition"
    would_have_helped:
      - "MFA on every external system, checked during acquisitions"
      - "Detecting the nine days of activity before the ransomware ran"
    sources:
