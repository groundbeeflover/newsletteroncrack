    checked: null

  - id: twilio-0ktapus-2022
    title: "Twilio and the 0ktapus phishing campaign"
    year: 2022
    summary: >-
      Text messages sent employees of many companies to fake login pages that
      captured both passwords and one-time codes. Twilio was breached this way.
      Cloudflare was targeted with the same kit; some employees entered their
      details, but the attack failed because Cloudflare used hardware security
      keys.
    root_cause: "MFA based on one-time codes, which a phishing page can relay"
    would_have_helped:
      - "FIDO2 security keys, which only work on the real site"
      - "Monitoring for newly registered lookalike domains"
    sources:
