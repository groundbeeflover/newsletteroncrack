        url: https://blog.npmjs.org/post/180565383195/details-about-the-event-stream-incident
    checked: null

  - id: xz-utils-2024
    title: "xz-utils backdoor"
    year: 2024
    summary: >-
      Over about two years, a contributor called "Jia Tan" gained maintainer
      trust in the xz compression project, then hid a backdoor in release
      tarballs that targeted OpenSSH on some Linux distributions. Andres Freund
      found it because SSH logins had become slightly slower, before it reached
      most stable releases.
    root_cause: "A single overworked maintainer, social pressure, and release artifacts that differed from the source repository"
    would_have_helped:
      - "Reproducible builds from the repository rather than from tarballs"
      - "Supporting maintainers of critical projects"
      - "Investigating small anomalies, as Freund did"
    sources:
