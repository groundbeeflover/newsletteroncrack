  - id: printnightmare-2021
    title: "PrintNightmare"
    year: 2021
    summary: >-
      A flaw in the Windows Print Spooler service (CVE-2021-34527) let
      authenticated users run code as SYSTEM, locally or remotely. Proof-of-
      concept code was published before a complete fix existed. The Print
      Spooler runs by default on most Windows machines, including domain
      controllers.
    root_cause: "A privileged service, enabled everywhere, with a flawed driver-installation path"
    would_have_helped:
      - "Disabling the Print Spooler where it isn't needed, especially on domain controllers"
      - "Restricting who can install printer drivers"
      - "Prompt patching"
    sources:
