  - id: google-aurora-2009
    title: "Operation Aurora, and Google's move to zero trust"
    year: 2009
    summary: >-
      Google disclosed in January 2010 that a targeted attack from China had hit
      its corporate network and at least twenty other large companies. In response
      it rebuilt access around users and devices rather than the network
      perimeter, an approach it later published as BeyondCorp.
    root_cause: "Trusting anything inside the corporate network perimeter"
    would_have_helped:
      - "Authenticating and authorising every request based on user and device"
      - "Treating the internal network as hostile"
    sources:
      - kind: company
        title: "A new approach to China (Official Google Blog, 2010)"
        url: https://googleblog.blogspot.com/2010/01/new-approach-to-china.html
      - kind: research
        title: "BeyondCorp: A New Approach to Enterprise Security (Google)"
        url: https://research.google/pubs/beyondcorp-a-new-approach-to-enterprise-security/
    checked: null

  - id: mgm-2023
    title: "MGM Resorts ransomware attack"
    year: 2023
    summary: >-
      Attackers claiming to be Scattered Spider said they got in by calling
      MGM's IT help desk while impersonating an employee. Systems across MGM's
      hotels and casinos went down for days, and press reports say virtualisation
      servers were encrypted with ALPHV ransomware. The attackers' account has
      not been independently confirmed. CISA's advisory documents the group's
      help-desk social engineering in general.
    root_cause: "Help-desk identity checks that a convincing caller could get past"
    would_have_helped:
      - "Strong identity verification before help-desk password or MFA resets"
      - "Phishing-resistant MFA for administrators"
      - "Alerting on MFA resets followed by admin activity"
    sources:
