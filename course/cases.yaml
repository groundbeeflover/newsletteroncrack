  - id: solarwinds-2020
    title: "SolarWinds Orion supply chain compromise"
    year: 2020
    summary: >-
      Attackers broke into SolarWinds' build process and inserted a backdoor
      (SUNBURST) into signed updates of the Orion network-monitoring product.
      Thousands of customers installed it; the attackers then chose a small
      number of high-value targets, including US government agencies. The
      backdoor's command-and-control traffic was designed to look like normal
      Orion traffic.
    root_cause: "A compromised build system producing trusted, signed malware"
    would_have_helped:
      - "Hardened, monitored, reproducible build pipelines"
      - "Limiting what network-management tools can reach"
      - "Detecting unusual outbound traffic from management servers"
    sources:
