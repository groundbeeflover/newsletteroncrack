  - id: dirty-cow-2016
    title: "Dirty COW"
    year: 2016
    summary: >-
      A race condition in the Linux kernel's copy-on-write handling
      (CVE-2016-5195) let an unprivileged local user write to files they could
      only read, and so become root. The bug had been in the kernel for about
      nine years.
    root_cause: "A kernel race condition in memory management"
    would_have_helped:
      - "Prompt kernel updates"
      - "Reducing who can run code on shared machines"
