  - id: colonial-pipeline-2021
    title: "Colonial Pipeline ransomware"
    year: 2021
    summary: >-
      DarkSide ransomware hit Colonial Pipeline's IT systems, and the company
      shut down its fuel pipeline as a precaution, causing shortages on the US
      East Coast. Its CEO told the Senate that the attackers came in through a
      legacy VPN account that had only a password and no MFA. The company paid
      a ransom, part of which the US Justice Department later seized.
    root_cause: "A forgotten remote-access account protected only by a password"
    would_have_helped:
      - "An inventory of remote-access accounts, with unused ones removed"
      - "MFA on all remote access"
      - "Separating IT from operational technology so IT ransomware doesn't stop operations"
    sources:
      - kind: official
