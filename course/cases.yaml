  - id: british-library-2023
    title: "British Library ransomware attack"
    year: 2023
    summary: >-
      The Rhysida ransomware group stole and encrypted data at the British
      Library, taking much of its online services down for months. The Library
      published a detailed lessons-learned review, which is unusually candid
      about how the attackers got in and why legacy systems made recovery
      slow.
    root_cause: "Read the review: it identifies the likely entry point and the legacy systems that slowed recovery"
    would_have_helped:
      - "Read the review and list its recommendations yourself; that's part of the exercise"
    sources:
      - kind: company
